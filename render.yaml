# Render Blueprint for the Fasteners backend.
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo.
# Then set the `sync: false` env vars (DATABASE_URL from Neon, admin creds).
services:
  - type: web
    name: fasteners-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Neon (or any) PostgreSQL connection string, e.g.
      # postgresql://user:pass@ep-xxx.neon.tech/fasteners?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: https://darrssh.github.io,http://localhost:5173
      - key: PUBLIC_BASE_URL
        sync: false
      - key: SEED_ON_STARTUP
        value: "true"
