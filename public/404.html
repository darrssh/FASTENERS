<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fasteners</title>
    <!-- GitHub Pages SPA fallback: deep links (e.g. /FASTENERS/products/x)
         land here; forward the path to index.html via ?p= so the router can
         restore it. -->
    <script>
      (function () {
        var base = '/FASTENERS';
        var path = location.pathname;
        var rest = path.indexOf(base) === 0 ? path.slice(base.length) : path;
        if (!rest) rest = '/';
        location.replace(base + '/?p=' + encodeURIComponent(rest + location.search + location.hash));
      })();
    </script>
  </head>
  <body></body>
</html>
