  <body>
    <div id="root"></div>
    <!-- GitHub Pages SPA fallback: restore deep-link path forwarded by 404.html (?p=...).
         Base derives from the served path (/FASTENERS/ → /FASTENERS, root → ''),
         so this survives repo renames and local preview. -->
    <script>
      (function () {
        var m = /[?&]p=([^&]*)/.exec(location.search);
        if (m) {
          try {
            var base = location.pathname.replace(/\/+$/, '');
            history.replaceState(null, '', base + decodeURIComponent(m[1]));
          } catch (e) { /* keep ?p= URL — app still boots */ }
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
