      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- GitHub Pages SPA fallback: restore deep-link path forwarded by 404.html (?p=...) -->
    <script>
      (function () {
        var m = /[?&]p=([^&]*)/.exec(location.search);
        if (m) {
          try {
            history.replaceState(null, '', '/FASTENERS' + decodeURIComponent(m[1]));
          } catch (e) { /* keep ?p= URL — app still boots */ }
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
